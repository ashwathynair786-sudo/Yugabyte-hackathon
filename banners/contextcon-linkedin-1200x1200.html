<style>
@font-face{font-family:'Bloka';src:url('../Bloka-Bold.otf') format('opentype');font-weight:700;font-display:block}
/* Meko brand tokens — from meko-brand-guidelines v0.2 */
:root{
  --ground:#000000; --panel:#121017; --purple:#7859fe; --white:#ffffff; --text:#e8e6ee; --muted:#9a97a8;
  --line-2:rgba(255,255,255,.18); --lime:#c7f252;
  --sans:'Inter',system-ui,-apple-system,sans-serif; --mono:'Roboto Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground)}
body{min-height:100vh;display:grid;place-items:center;-webkit-font-smoothing:antialiased}
.post{position:relative;width:1200px;height:1200px;overflow:hidden;background:var(--ground);font-family:var(--sans);color:var(--text)}
.tex{position:absolute;inset:0;width:100%;height:100%;display:block}
/* content sits inside Instagram's safe area (clear of top ~250px and bottom ~250px UI) */
.content{position:absolute;left:80px;width:620px;top:80px;bottom:80px;display:flex;flex-direction:column;align-items:flex-start}
.pill{margin:auto 0 0;font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);
  background:rgba(18,16,23,.85);border:2px solid rgba(199,242,82,.6);border-radius:999px;padding:12px 26px;display:flex;align-items:center;gap:14px}
.pill::before{content:'';width:14px;height:14px;border-radius:50%;background:var(--lime)}
h1{margin:32px 0 0;width:620px}
h1 img{display:block;width:100%;height:auto}
.lede{margin:36px 0 0;font-size:32px;line-height:1.32;letter-spacing:-.01em;color:var(--white);text-wrap:balance}
.prize{margin-top:40px;width:100%;display:flex;align-items:center;gap:24px;background:var(--panel);border:2px solid var(--line-2);border-radius:24px;padding:26px 32px}
.prize svg{flex:none;width:48px;height:48px;display:block}
.prize .k{font-family:var(--mono);font-size:21px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--white);white-space:nowrap}
.prize .v{margin-left:auto;font-family:'Bloka',var(--sans);font-size:70px;line-height:1;font-weight:700;letter-spacing:-.0225em;color:var(--lime);white-space:nowrap}
.meko{width:220px}
.powered{margin:0;align-self:flex-start;display:flex;align-items:center;gap:14px;
  background:rgba(0,0,0,.6);border:1px solid var(--line-2);border-radius:999px;padding:12px 26px 12px 24px}
.powered .k{font-family:var(--mono);font-size:18px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.powered .v{display:block;height:30px;width:auto}
.meko svg{display:block;width:100%;height:auto}
.spacer{margin-top:auto}
.powered{display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.6);border:1px solid var(--line-2);border-radius:999px;padding:10px 24px 10px 22px}
.powered .k{font-size:16px}
.powered .v{height:26px}
</style>
</head>
