:root{--ground:#000000;--purple:#7859fe;--white:#ffffff;--sans:'Inter',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground)}
body{min-height:100vh;display:grid;place-items:center;-webkit-font-smoothing:antialiased}
.strip{width:2000px;height:300px;background:var(--ground);display:flex;align-items:center;justify-content:center;gap:36px}
.strip svg{width:104px;height:104px;flex:none;display:block;fill:var(--purple)}
.strip p{margin:0;font-family:var(--sans);font-size:64px;line-height:1;font-weight:600;letter-spacing:-.02em;color:var(--white);white-space:nowrap}
</style>
